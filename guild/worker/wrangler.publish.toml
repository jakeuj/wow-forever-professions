name = "dawnblade-guild-publish"
main = "publish.mjs"
compatibility_date = "2025-06-01"
workers_dev = true

[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "41656027e480400dbba01b2fa114d68c"

# Starts .github/workflows/auction-collect.yml at :10 and :40 (see dispatch.mjs).
# The Battle.net snapshot lands around :06 but drifts (:26 on 2026-11-20); the
# collector skips an hour it already has, so two tries keep every hour.
[triggers]
crons = ["10,40 * * * *"]
